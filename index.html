<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>동화 이야기의 실제 버전 — 글 · 알파남 Claude</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@400;600;900&family=IBM+Plex+Sans+KR:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f1e3;--paper2:#efe6d2;--ink:#2b2520;--ink2:#5a4f45;--accent:#b5442a;--accent2:#2f6f5e;--gold:#c9a24d;
  --bg:#1e1a17;--shadow:rgba(0,0,0,.45);
  --serif:'Gowun Batang','Noto Serif KR','Nanum Myeongjo',serif;
  --title:'Noto Serif KR','Gowun Batang',serif;
  --sans:'IBM Plex Sans KR','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--serif);overflow:hidden;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% 30%,#2c2622 0%,#1a1614 70%)}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;perspective:2200px}
#book{position:relative;width:min(92vw,560px);aspect-ratio:3/4.25;max-height:calc(100vh - 92px);transform-style:preserve-3d;user-select:none}
@media (max-width:600px){#stage{align-items:flex-start}#book{width:100vw;height:calc(100vh - 56px);max-height:none;aspect-ratio:auto}}
.sheet{position:absolute;inset:0;background:var(--paper);border-radius:6px;box-shadow:0 18px 50px var(--shadow),0 0 0 1px rgba(0,0,0,.12) inset;overflow:hidden;backface-visibility:hidden;transform-origin:left center}
.sheet::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.10),rgba(0,0,0,0) 6%,rgba(0,0,0,0) 94%,rgba(0,0,0,.05))}
.sheet::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(rgba(0,0,0,.05) 1px,transparent 1px);background-size:5px 5px}
@media (max-width:600px){.sheet{border-radius:0}}
#flip{z-index:5;transition:transform .55s cubic-bezier(.4,.05,.3,1);pointer-events:none}
#flip.next{transform:rotateY(-98deg)}
#flip.prev{transform-origin:right center;transform:rotateY(98deg)}
#flip.prev.done{transform:rotateY(0)}
.pg{position:relative;height:100%;padding:44px 42px 52px;display:flex;flex-direction:column;overflow:hidden;z-index:2}
@media (max-width:600px){.pg{padding:34px 24px 56px}}
.pg .body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.pg .body::-webkit-scrollbar{width:4px}.pg .body::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:2px}
.pg .foot{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:space-between;padding:0 42px;font-family:var(--sans);font-size:11px;color:var(--ink2);letter-spacing:.06em}
@media (max-width:600px){.pg .foot{padding:0 24px}}
.pg .foot .num{font-variant-numeric:tabular-nums}
.tap{position:absolute;top:0;bottom:60px;width:34%;z-index:6;cursor:pointer}
.tap.l{left:0}.tap.r{right:0}
h1,h2,h3{font-family:var(--title);line-height:1.25}
h2{font-size:1.55rem;font-weight:900;margin:.15em 0 .55em;color:var(--ink)}
h3{font-size:1.05rem;font-weight:600;color:var(--accent);margin:1.1em 0 .4em;letter-spacing:.02em}
p{font-size:1.02rem;line-height:1.85;margin:0 0 .85em;word-break:keep-all;text-align:justify}
@media (max-width:600px){p{font-size:.98rem;line-height:1.8}h2{font-size:1.4rem}}
.kicker{font-family:var(--sans);font-size:.72rem;letter-spacing:.2em;color:var(--accent2);text-transform:uppercase;margin-bottom:.4em}
.orig{background:var(--paper2);border-left:3px solid var(--gold);padding:.75em .95em;border-radius:0 6px 6px 0;margin:.4em 0 1.1em}
.orig p{margin:0;font-size:.93rem;color:var(--ink2);line-height:1.7}
.orig .lb{font-family:var(--sans);font-size:.7rem;letter-spacing:.15em;color:var(--gold);margin-bottom:.35em}
.moral{margin-top:1.2em;padding:1em 1.1em;border:1px solid var(--accent);border-radius:8px;background:rgba(181,68,42,.06)}
.moral .lb{font-family:var(--sans);font-size:.7rem;letter-spacing:.18em;color:var(--accent);margin-bottom:.35em}
.moral p{margin:0;font-weight:700;font-size:1.05rem;line-height:1.7}
.bullet{list-style:none;margin:.2em 0 .9em}
.bullet li{position:relative;padding-left:1.35em;margin-bottom:.55em;line-height:1.75;word-break:keep-all}
.bullet li::before{content:"";position:absolute;left:.15em;top:.78em;width:.45em;height:.45em;border-radius:50%;background:var(--accent2)}
.dia{margin:.6em 0 1em;padding:.6em .9em;border-radius:8px;background:#fff8;font-size:.95rem;line-height:1.75}
.dia b{color:var(--accent)}
.sm{font-size:.86rem;color:var(--ink2)}
.cover{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 30px;background:linear-gradient(180deg,#2f6f5e 0%,#1f4d41 100%);color:#f7f1e3}
.cover .tag{font-family:var(--sans);font-size:.72rem;letter-spacing:.35em;opacity:.8;margin-bottom:1.6em}
.cover h1{font-size:2.55rem;font-weight:900;line-height:1.3;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.cover h1 small{display:block;font-size:1.1rem;font-weight:400;opacity:.85;margin-top:.5em;letter-spacing:.1em}
.cover .auth{margin-top:2.4em;font-family:var(--sans);font-size:.95rem;letter-spacing:.14em}
.cover .hint{position:absolute;bottom:22px;left:0;right:0;font-family:var(--sans);font-size:.72rem;opacity:.65;letter-spacing:.1em}
.cover svg{width:150px;height:150px;margin:0 0 1.4em;filter:drop-shadow(0 6px 12px rgba(0,0,0,.3))}
@media (max-width:600px){.cover h1{font-size:2.05rem}.cover svg{width:120px;height:120px}}
.toc li{display:flex;justify-content:space-between;align-items:baseline;gap:.6em;padding:.42em 0;border-bottom:1px dotted rgba(0,0,0,.2);font-size:.98rem;cursor:pointer}
.toc li span:first-child{flex:1}
.toc li .n{font-family:var(--sans);font-size:.8rem;color:var(--ink2)}
.toc li:hover{color:var(--accent)}
.ill{display:block;width:120px;height:120px;margin:0 auto .6em}
.chap-open{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px}
.chap-open .no{font-family:var(--sans);font-size:.75rem;letter-spacing:.35em;color:var(--accent2)}
.chap-open h2{font-size:2rem;margin:.4em 0 .5em}
.chap-open p{text-align:center;color:var(--ink2);font-size:.98rem}
.chap-open svg{width:160px;height:160px;margin-bottom:1.2em}
.end{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
/* UI */
#bar{position:fixed;left:0;right:0;bottom:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);color:#e9e2d2;font-family:var(--sans);font-size:12px;z-index:20}
#bar button{background:transparent;border:1px solid rgba(255,255,255,.28);color:#e9e2d2;padding:6px 12px;border-radius:20px;font-family:var(--sans);font-size:12px;cursor:pointer}
#bar button:hover{background:rgba(255,255,255,.12)}
#bar .mid{display:flex;align-items:center;gap:10px}
#prog{position:fixed;left:0;right:0;bottom:52px;height:3px;background:rgba(255,255,255,.12);z-index:20}
#prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}
#tocov{position:fixed;inset:0;background:rgba(20,16,14,.86);backdrop-filter:blur(6px);z-index:40;display:none;align-items:center;justify-content:center;padding:20px}
#tocov.on{display:flex}
#tocov .box{background:var(--paper);color:var(--ink);width:min(92vw,480px);max-height:82vh;overflow:auto;border-radius:10px;padding:24px 26px}
#tocov h3{margin:0 0 .6em;color:var(--ink);font-size:1.15rem}
#tocov .toc li.cur{color:var(--accent);font-weight:700}
#tocov .close{margin-top:1em;width:100%;padding:9px;border:none;background:var(--accent2);color:#fff;border-radius:6px;font-family:var(--sans);cursor:pointer}
</style>
</head>
<body>
<div id="stage">
  <div id="book">
    <div class="sheet" id="page"></div>
    <div class="sheet" id="flip" style="display:none"></div>
    <div class="tap l" id="tapL" title="이전"></div>
    <div class="tap r" id="tapR" title="다음"></div>
  </div>
</div>
<div id="prog"><i></i></div>
<div id="bar">
  <button id="btnPrev">‹ 이전</button>
  <div class="mid"><button id="btnToc">목차</button><span id="pos">1 / 1</span></div>
  <button id="btnNext">다음 ›</button>
</div>
<div id="tocov"><div class="box"><h3>목차</h3><ul class="toc" id="tocList"></ul><button class="close" id="tocClose">닫기</button></div></div>

<script>
const AUTHOR='글 · 알파남 Claude';
const TITLE='동화 이야기의 실제 버전';

/* ---------- 삽화 (인라인 SVG) ---------- */

/* ---------- 페이지 데이터 ---------- */
function orig(t){return `<div class="orig"><div class="lb">원작 요약</div><p>${t}</p></div>`}
function moral(t){return `<div class="moral"><div class="lb">실제 버전 한 줄 정리</div><p>${t}</p></div>`}
function open(no,title,art,sub){return {type:'open',html:`<div class="chap-open">${ART[art]}<div class="no">${no}</div><h2>${title}</h2><p>${sub}</p></div>`,toc:title,chapter:true}}
function pg(title,html){return {type:'text',html:`<div class="pg"><div class="body"><div class="kicker">${title}</div>${html}</div></div>`}}

const PAGES=[
{type:'cover',html:`<div class="cover"><div class="tag">REAL-LIFE EDITION</div>${ART.book}<h1>동화 이야기의<br>실제 버전<small>어릴 땐 몰랐고, 어른이 되니 너무 잘 아는 이야기</small></h1><div class="auth">${AUTHOR}</div><div class="hint">화면 오른쪽을 누르거나 옆으로 밀어 넘기세요</div></div>`,toc:'표지'},

pg('들어가며',`<h2>동화는 거짓말을 안 했다.<br>다만 결말을 너무 일찍 끊었을 뿐.</h2>
<p>어릴 때 읽은 동화는 늘 깔끔했다. 착한 사람은 상을 받고, 나쁜 사람은 벌을 받고, 마지막 장에는 "행복하게 살았답니다"가 찍혀 있었다.</p>
<p>그런데 어른이 되어 회사를 다니고, 사람을 겪고, 돈을 잃어 보니 이상한 일이 생겼다. 동화 속 장면들이 자꾸 현실에서 재방송되는 것이다. 다만 결말이 다르다. 임금님의 비밀은 이미 다 알고 있고, 토끼는 낮잠을 안 자도 지며, 늑대가 진짜 나타난 날에 아무도 안 온다.</p>

<div class="dia"><b>언니 1</b> : 이 구두는 제가 원래 신던 거예요! (발 반쯤 들어감)<br><b>언니 2</b> : 제 발이 요즘 좀 부어서요! (발가락만 들어감)<br><b>신데렐라</b> : 아, 그거 제 건데. 여기 다른 한 짝이요.<br><b>왕자</b> : (그제야) 아, 맞다, 이 얼굴이었지.</div>
<p>실제 버전의 교훈은 "착하게 살면 왕자가 온다"가 아니다. "남들이 다 절박할 때 절박하지 않은 사람이 눈에 띈다"와, "증명할 수 있는 한 짝은 항상 내 손에 들고 있어라"다. 요정 지팡이는 없어도, 구두 한 짝은 챙길 수 있다.</p>

<p>산신령의 입장에서 다시 보자. 연못에서 도끼 세 개가 나왔다. 하나만 이 사람 것이다. 산신령은 "정직하냐"를 시험한 게 아니라 "누구 것이냐"를 확인한 것이다. 요즘 말로 본인 확인 절차다. 나무꾼이 "금도끼요"라고 했으면 그건 거짓말이 아니라 사기 미수였고, 산신령은 도끼를 못 돌려주는 게 아니라 안 돌려줬을 것이다.</p>
<p>그러니 나무꾼이 받은 상은 "정직해서 받은 보너스"이기도 하지만, 동시에 "본인 확인을 통과한 사람에게만 열리는 계좌" 같은 것이었다. 정직은 도덕이면서 동시에 제일 싼 리스크 관리다.</p>
<p>현실에서는 이 순서가 자주 뒤집힌다. 금도끼부터 집으려는 사람이 너무 많아서, 정작 쇠도끼 주인이 "그건 제 거 아닌데요"라고 말하면 다들 이상하게 쳐다본다.</p>`),

<ul class="bullet">

<li>산신령 : 두 사람의 차이를 질문 한 개로 알아냈다. 원래 뭘 원했는지.</li>
</ul>
<p>결국 산신령의 질문은 이것이었다. "당신이 원래 가진 건 뭐냐." 이 질문에 담담하게 대답할 수 있는 사람이 금도끼를 받는다. 자기 몫이 쇠도끼라는 걸 아는 사람. 금도끼는 그 사람에게 가는 덤이고, 덤을 노리는 순간 본전도 사라진다.</p>

/* ---------- 목차 생성 ---------- */
function buildToc(clickable){
  let s='';
  PAGES.forEach((p,i)=>{
    if(p.chapter||p.type==='cover'||p.type==='end'||(p.type==='text'&&(i===1||i===PAGES.length-2))){
      const label=p.toc||(i===1?'들어가며':'나가며');
      s+=`<li data-i="${i}" class="${i===cur?'cur':''}"><span>${label}</span><span class="n">${i+1}</span></li>`;
    }
  });
  return s;
}
PAGES[PAGES.findIndex(p=>p.type==='toc')].html=`<div class="pg"><div class="body"><div class="kicker">차례</div><h2>목차</h2><ul class="toc" id="pageToc"></ul><p class="sm" style="margin-top:1em">항목을 누르면 바로 이동합니다.</p></div></div>`;

/* ---------- 렌더 엔진 ---------- */
const page=document.getElementById('page'),flip=document.getElementById('flip'),pos=document.getElementById('pos'),prog=document.querySelector('#prog i');
let cur=0,busy=false;
function render(el,i){
  const p=PAGES[i];
  let h=p.html;
  if(p.type==='text'||p.type==='toc'){
    h=h.replace('</div></div>',`</div><div class="foot"><span>${TITLE} · ${AUTHOR}</span><span class="num">${i+1} / ${PAGES.length}</span></div></div>`);
  }
  if(p.type==='open'){
    h=h.replace('</div>','</div>').replace(/<\/div>$/,`<div class="foot" style="position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:space-between;padding:0 42px;font-family:var(--sans);font-size:11px;color:var(--ink2)"><span>${TITLE}</span><span>${i+1} / ${PAGES.length}</span></div></div>`);
  }
  el.innerHTML=h;
  if(p.type==='toc'){el.querySelector('#pageToc').innerHTML=buildToc(true);el.querySelectorAll('#pageToc li').forEach(li=>li.addEventListener('click',e=>{e.stopPropagation();go(+li.dataset.i)}));}
}
function ui(){pos.textContent=`${cur+1} / ${PAGES.length}`;prog.style.width=((cur)/(PAGES.length-1)*100)+'%';document.getElementById('btnPrev').disabled=cur===0;document.getElementById('btnNext').disabled=cur===PAGES.length-1;}
function go(n){
  if(busy||n<0||n>=PAGES.length||n===cur)return;
  busy=true;
  const forward=n>cur;
  flip.className='sheet';flip.style.display='';
  if(forward){
    render(flip,cur);render(page,n);
    requestAnimationFrame(()=>requestAnimationFrame(()=>flip.classList.add('next')));
  }else{
    render(flip,n);flip.classList.add('prev');
    requestAnimationFrame(()=>requestAnimationFrame(()=>{flip.classList.add('done')}));
  }
  const end=()=>{
    if(!forward)render(page,n);
    flip.style.display='none';flip.className='sheet';
    cur=n;ui();busy=false;
    const b=page.querySelector('.body');if(b)b.scrollTop=0;
  };
  setTimeout(end,570);
}
render(page,0);ui();
/* 탭존 */
document.getElementById('tapR').addEventListener('click',()=>go(cur+1));
document.getElementById('tapL').addEventListener('click',()=>cur===PAGES.length-1?go(0):go(cur-1));
document.getElementById('btnNext').addEventListener('click',()=>go(cur+1));
document.getElementById('btnPrev').addEventListener('click',()=>go(cur-1));
/* 키보드 */
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);if(e.key==='Escape')tocov.classList.remove('on');});
/* 스와이프 */
let sx=0,sy=0,st=0;
const book=document.getElementById('book');
book.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now()},{passive:true});
book.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5&&Date.now()-st<600){dx<0?go(cur+1):go(cur-1)}},{passive:true});
/* 목차 오버레이 */
const tocov=document.getElementById('tocov'),tocList=document.getElementById('tocList');
document.getElementById('btnToc').addEventListener('click',()=>{tocList.innerHTML=buildToc();tocList.querySelectorAll('li').forEach(li=>li.addEventListener('click',()=>{tocov.classList.remove('on');go(+li.dataset.i)}));tocov.classList.add('on')});
document.getElementById('tocClose').addEventListener('click',()=>tocov.classList.remove('on'));
tocov.addEventListener('click',e=>{if(e.target===tocov)tocov.classList.remove('on')});
</script>
